<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CITADEL — Personal Digital Security Vault</title>
  <meta name="description" content="CITADEL is a secure digital vault where users can manage their website passwords, login credentials, important documents, and private notes from one centralized, protected platform.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23059669'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>">

  <!-- Early Theme Setter to prevent FOUC -->
  <script>
    (function() {
      try {
        var state = localStorage.getItem('citadel_vault_state');
        if (state) {
          var parsed = JSON.parse(state);
          if (parsed && parsed.settings && parsed.settings.theme) {
            document.documentElement.setAttribute('data-theme', parsed.settings.theme);
          }
        }
      } catch(e) {}
    })();
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

    tailwind.config = {
      darkMode: ['selector', '[data-theme="dark"]'],

        extend: {

* {
  box-sizing: border-box;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background-color 0.3s ease, color 0.3s ease;
}

.mono {
  font-family: 'Fira Code', monospace;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: rgba(15, 23, 42, 0.4);
}
::-webkit-scrollbar-thumb {
  background: rgba(5, 150, 105, 0.4);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(5, 150, 105, 0.7);
}

/* Glassmorphism Cards */
.glass-panel {
  background: var(--bg-surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-subtle);
  border-radius: 1rem;
  box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.glass-panel:hover {
  border-color: var(--border-glow);
  box-shadow: 0 14px 40px -10px rgba(5, 150, 105, 0.2);
}

.glass-panel-elevated {
  background: var(--bg-surface-elevated);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-subtle);
  border-radius: 1.25rem;
}

/* Cybersecurity Gradient Backgrounds & Borders */
.cyber-gradient-text {
  background: linear-gradient(135deg, #10B981 0%, #059669 50%, #047857 100%);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
html[data-theme="light"] .cyber-gradient-text {
  background: linear-gradient(135deg, #047857 0%, #059669 50%, #064E3B 100%);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

  background: #059669 !important;
  background-image: linear-gradient(135deg, #059669 0%, #047857 50%, #065F46 100%) !important;
  color: #FFFFFF !important;
  border: 1px solid #047857 !important;
  position: relative;
  overflow: hidden;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 4px 16px -2px rgba(5, 150, 105, 0.4) !important;
}

.cyber-glow-btn:hover {
  background: #047857 !important;
  background-image: linear-gradient(135deg, #047857 0%, #065F46 100%) !important;
  transform: translateY(-1.5px);
  box-shadow: 0 8px 24px 0px rgba(5, 150, 105, 0.55) !important;
  color: #FFFFFF !important;
}

.cyber-glow-btn:active {
  transform: translateY(0);
  background: #065F46 !important;
  box-shadow: 0 2px 8px 0px rgba(5, 150, 105, 0.35) !important;

  outline-offset: 2px !important;
}

.cyber-glow-btn[disabled] {
  opacity: 0.65 !important;
  background: #9CA3AF !important;
  border-color: #9CA3AF !important;
  box-shadow: none !important;

  cursor: not-allowed !important;

  background-color: #047857 !important;
}

/* Keyframes & Animations */
@keyframes floatSlow {
  0%, 100% {
    transform: translateY(0px) rotate(0deg);
  }
  50% {
    transform: translateY(-10px) rotate(1deg);
  }
}

@keyframes floatReverse {
  0%, 100% {
    transform: translateY(0px) rotate(0deg);
  }
  50% {
    transform: translateY(10px) rotate(-1deg);
  }
}

@keyframes pulseGlow {
  0%, 100% {
    opacity: 0.4;
    transform: scale(1);
  }
  50% {
    opacity: 0.8;
    transform: scale(1.05);
  }
}

@keyframes radarSweep {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}

@keyframes modalFadeIn {
  from {
    opacity: 0;
    transform: scale(0.96) translateY(8px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

@keyframes toastSlideIn {
  from {
    opacity: 0;
    transform: translateX(100%) translateY(0);
  }
  to {
    opacity: 1;
    transform: translateX(0) translateY(0);
  }
}

.animate-float-1 {
  animation: floatSlow 6s ease-in-out infinite;
}

.animate-float-2 {
  animation: floatReverse 7s ease-in-out infinite 0.5s;
}

.animate-float-3 {
  animation: floatSlow 8s ease-in-out infinite 1.5s;
}

.animate-pulse-glow {
  animation: pulseGlow 4s ease-in-out infinite;
}

.animate-modal {
  animation: modalFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.animate-toast {
  animation: toastSlideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.radar-spinner {
  animation: radarSweep 3s linear infinite;
}

/* Vault Ring Graphic in CSS */
.vault-shield-outer {
  position: relative;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(13, 21, 39, 0.8) 70%);
  border: 2px solid rgba(99, 102, 241, 0.35);
  box-shadow: 0 0 50px rgba(99, 102, 241, 0.25), inset 0 0 30px rgba(99, 102, 241, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
}

.vault-ring-dials {
  position: absolute;
  inset: 15px;
  border-radius: 50%;
  border: 2px dashed rgba(6, 182, 212, 0.4);
  animation: radarSweep 30s linear infinite;
}

.vault-shield-inner {
  position: relative;
  width: 170px;
  height: 170px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1E1B4B 0%, #0F172A 100%);
  border: 1px solid rgba(139, 92, 246, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
}

/* Subtle Matrix Grid */
.cyber-grid-bg {
  background-image: 
    linear-gradient(rgba(99, 102, 241, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(99, 102, 241, 0.04) 1px, transparent 1px);
  background-size: 32px 32px;
}

/* Circular Gauge Animation */
.progress-ring-circle {
  transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  transform: rotate(-90deg);
  transform-origin: 50% 50%;
}

/* Tooltip */
[data-tooltip] {
  position: relative;
}
[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: 125%;
  left: 50%;
  transform: translateX(-50%);
  padding: 4px 8px;
  background: #0F172A;
  color: #F8FAFC;
  font-size: 11px;
  font-weight: 500;
  border-radius: 4px;
  border: 1px solid rgba(99, 102, 241, 0.3);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s ease;
  z-index: 50;
}
[data-tooltip]:hover::after {
  opacity: 1;
}

/* Toast Container */
#toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 9999;
  pointer-events: none;
}

.toast-item {
  pointer-events: auto;
  min-width: 300px;
  max-width: 420px;
}
